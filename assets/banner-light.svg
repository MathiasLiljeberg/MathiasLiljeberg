<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F8EC"/></linearGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#DDE8CF"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="1280" height="320" fill="url(#fade)"/></mask>
<style>
.in{opacity:0;animation:fade .9s ease-out forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ring{transform-origin:1065px 160px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.in{opacity:1;animation:none}.ring{animation:none}}
</style>
</defs>
<rect width="1280" height="320" rx="18" fill="url(#bg)"/>
<rect width="1280" height="320" rx="18" fill="url(#dots)" mask="url(#m)"/>
<rect x="80" y="62" width="44" height="4" rx="2" fill="#95BF47"/>
<g class="in d1"><text x="80" y="128" font-size="54" font-weight="700" fill="#1F2328" letter-spacing="-1">Mathias Tøpfer</text></g>
<g class="in d2"><text x="80" y="176" font-size="24" fill="#59636E">Projektleder · Shopify, e-commerce &amp; teknisk rådgivning</text>
<text x="80" y="208" font-size="17" fill="#59636E"><tspan fill="#95BF47" font-weight="600">ShopHelten</tspan>  —  Shopify Premier-bureau  ·  København</text></g>
<g class="in d3"><g class="chip"><rect x="80" y="232" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0BA"/><text x="140" y="254" text-anchor="middle" font-size="14" fill="#1F2328" font-weight="500">Shopify Plus</text></g><g class="chip"><rect x="210.39999999999998" y="232" width="137" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0BA"/><text x="279" y="254" text-anchor="middle" font-size="14" fill="#1F2328" font-weight="500">Løsningsdesign</text></g><g class="chip"><rect x="357.19999999999993" y="232" width="88" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0BA"/><text x="401" y="254" text-anchor="middle" font-size="14" fill="#1F2328" font-weight="500">CRO &amp; UX</text></g><g class="chip"><rect x="454.79999999999995" y="232" width="129" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0BA"/><text x="519" y="254" text-anchor="middle" font-size="14" fill="#1F2328" font-weight="500">Integrationer</text></g><g class="chip"><rect x="593.4" y="232" width="120" height="34" rx="17" fill="#FFFFFF" stroke="#CFE0BA"/><text x="654" y="254" text-anchor="middle" font-size="14" fill="#1F2328" font-weight="500">AI-workflows</text></g></g>
<g class="ring" fill="none" stroke="#95BF47">
<circle cx="1065" cy="160" r="104" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="4 10"/>
<circle cx="1065" cy="160" r="76" stroke-opacity=".35" stroke-width="1.5"/>
</g>
<g transform="translate(1065 160)" fill="none" stroke="#95BF47" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M-30 -14 H30 L25 38 H-25 Z" fill="#95BF47" fill-opacity=".12"/>
<path d="M-14 -14 V-24 A14 14 0 0 1 14 -24 V-14"/>
</g>
</svg>