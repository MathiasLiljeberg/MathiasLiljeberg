<rect x="64" y="51" width="28" height="4" rx="2" fill="#4A1F73"/><text x="104" y="58" font-size="15" font-weight="700" letter-spacing="2.2" fill="#59636E">MIN TILGANG</text><rect x="64.0" y="88" width="266.7" height="190" rx="14" fill="#FFFFFF" stroke="#D5C6EC"/>
<text x="88.0" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#4A1F73">01</text>
<text x="88.0" y="168" font-size="22" font-weight="700" fill="#1F2328">Forstå</text><text x="88.0" y="200" font-size="16" fill="#59636E">Afklar behovet sammen med</text><text x="88.0" y="224" font-size="16" fill="#59636E">kunden – forretningen først,</text><text x="88.0" y="248" font-size="16" fill="#59636E">teknikken bagefter.</text><path d="M342.7 174.0 l8 9 l-8 9" fill="none" stroke="#4A1F73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="366.7" y="88" width="266.7" height="190" rx="14" fill="#FFFFFF" stroke="#D5C6EC"/>
<text x="390.7" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#4A1F73">02</text>
<text x="390.7" y="168" font-size="22" font-weight="700" fill="#1F2328">Oversæt</text><text x="390.7" y="200" font-size="16" fill="#59636E">Skitsér en konkret løsning,</text><text x="390.7" y="224" font-size="16" fill="#59636E">som udviklere og partnere</text><text x="390.7" y="248" font-size="16" fill="#59636E">kan bygge på.</text><path d="M645.3 174.0 l8 9 l-8 9" fill="none" stroke="#4A1F73" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="669.3" y="88" width="266.7" height="190" rx="14" fill="#FFFFFF" stroke="#D5C6EC"/>
<text x="693.3" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#4A1F73">03</text>
<text x="693.3" y="168" font-size="22" font-weight="700" fill="#1F2328">Implementér</text><text x="693.3" y="200" font-size="16" fill="#59636E">Følg løsningen hele vejen til</text><text x="693.3" y="224" font-size="16" fill="#59636E">noget, der virker i praksis.</text><line x1="64" y1="314" x2="936" y2="314" stroke="#D5C6EC"/><text x="64" y="358" font-size="18" fill="#1F2328">Har du en Shopify-shop, der skal løftes?</text><text x="936" y="358" text-anchor="end" font-size="17" font-weight="700" fill="#4A1F73">Skriv til mig på LinkedIn  →</text></svg>