<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F8EC"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#DDE8CF"/></pattern>
<linearGradient id="fd" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="m"><rect width="1000" height="250" fill="url(#fd)"/></mask><style>


.ring{transform-origin:835px 150px;animation:s 40s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}</style></defs>
<rect x=".5" y=".5" width="999" height="249" rx="16" fill="url(#bg)" stroke="#D7E5C4"/>
<rect x="64" y="51" width="28" height="4" rx="2" fill="#95BF47"/><text x="104" y="58" font-size="15" font-weight="700" letter-spacing="2.2" fill="#59636E">OM MIG</text><g class="in d1"><text x="64" y="104" font-size="21" fill="#1F2328">Jeg hjælper brands med at få mere ud af deres Shopify-webshop –</text><text x="64" y="138" font-size="21" fill="#1F2328">både forretningsmæssigt og teknisk. Som bindeled mellem kunde,</text><text x="64" y="172" font-size="21" fill="#1F2328">udvikling og eksterne partnere afklarer jeg behovet, designer</text><text x="64" y="206" font-size="21" fill="#1F2328">løsningen og følger den hele vejen til noget, der virker i praksis.</text></g></svg>