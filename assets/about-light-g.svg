<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="272" viewBox="0 0 1000 272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F8F7"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#DFE5E2"/></pattern>
<linearGradient id="fd" x1="0" x2="1"><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
<mask id="m"><rect width="1000" height="272" fill="url(#fd)"/></mask><style></style></defs>
<rect x=".5" y=".5" width="999" height="271" rx="16" fill="url(#bg)" stroke="#DCE3DF"/>
<rect x="64" y="51" width="28" height="4" rx="2" fill="#4F8F2E"/><text x="104" y="58" font-size="15" font-weight="700" letter-spacing="2.2" fill="#59636E">OM MIG</text><text x="64" y="100" font-size="18" fill="#1F2328">Jeg er projektleder hos ShopHelten, et Shopify Premier-bureau, hvor jeg hjælper brands med at få</text><text x="64" y="130" font-size="18" fill="#1F2328">mere ud af deres webshop – både forretningsmæssigt og teknisk. Jeg står midt imellem kunden,</text><text x="64" y="160" font-size="18" fill="#1F2328">udvikleren og eksterne partnere: jeg afklarer behovet, skitserer en løsning og følger den hele vejen til</text><text x="64" y="190" font-size="18" fill="#1F2328">noget, der virker i praksis. <tspan fill="#7A5AC8" font-weight="600">AI-agents</tspan> og <tspan fill="#7A5AC8" font-weight="600">agent-workflows</tspan> er en fast del af værktøjskassen – til</text><text x="64" y="220" font-size="18" fill="#1F2328">research, QA, analyse og dokumentation.</text></svg>