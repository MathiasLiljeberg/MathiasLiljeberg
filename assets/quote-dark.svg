<text x="88.0" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#A78BFA">01</text>
<text x="88.0" y="168" font-size="22" font-weight="700" fill="#F0F6FC">Forstå</text><text x="88.0" y="200" font-size="16" fill="#9AA4AE">Afklar behovet sammen med</text><text x="88.0" y="224" font-size="16" fill="#9AA4AE">kunden – forretningen først,</text><text x="88.0" y="248" font-size="16" fill="#9AA4AE">teknikken bagefter.</text><path d="M342.7 174.0 l8 9 l-8 9" fill="none" stroke="#A78BFA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="366.7" y="88" width="266.7" height="190" rx="14" fill="#10161B" stroke="#2C2545"/>
<text x="390.7" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#A78BFA">02</text>
<text x="390.7" y="168" font-size="22" font-weight="700" fill="#F0F6FC">Oversæt</text><text x="390.7" y="200" font-size="16" fill="#9AA4AE">Skitsér en konkret løsning,</text><text x="390.7" y="224" font-size="16" fill="#9AA4AE">som udviklere og partnere</text><text x="390.7" y="248" font-size="16" fill="#9AA4AE">kan bygge på.</text><path d="M645.3 174.0 l8 9 l-8 9" fill="none" stroke="#A78BFA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="669.3" y="88" width="266.7" height="190" rx="14" fill="#10161B" stroke="#2C2545"/>
<text x="693.3" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#A78BFA">03</text>
<text x="693.3" y="168" font-size="22" font-weight="700" fill="#F0F6FC">Implementér</text><text x="693.3" y="200" font-size="16" fill="#9AA4AE">Følg løsningen hele vejen til</text><text x="693.3" y="224" font-size="16" fill="#9AA4AE">noget, der virker i praksis.</text><line x1="64" y1="314" x2="936" y2="314" stroke="#2C2545"/><text x="64" y="358" font-size="18" fill="#F0F6FC">Har du en Shopify-shop, der skal løftes?</text><text x="936" y="358" text-anchor="end" font-size="17" font-weight="700" fill="#A78BFA">Skriv til mig på LinkedIn  →</text></svg>